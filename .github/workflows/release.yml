name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+\.\d+)$') {
            throw "Tag must match vMAJOR.MINOR.PATCH.BUILD (e.g. v1.0.0.0). Got: $tag"
          }

          $version = $Matches.version
          Write-Host "Tag=$tag Version=$version"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Publish
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $repo = "${{ github.repository }}"
          $repoUrl = "https://github.com/$repo"
          $releasesApi = "https://api.github.com/repos/$repo/releases/latest"
          $releasesPage = "https://github.com/$repo/releases"

          $common = @(
            "-c", "Release",
            "-r", "win-x64",
            "-p:Distribution=GitHub",
            "-p:Version=$v",
            "-p:AssemblyVersion=$v",
            "-p:FileVersion=$v",
            "-p:InformationalVersion=$v",
            "-p:GitHubRepository=$repo",
            "-p:RepositoryUrl=$repoUrl",
            "-p:UpdateReleasesApiUrl=$releasesApi",
            "-p:UpdateReleasesPageUrl=$releasesPage"
          )

          Write-Host "GitHubRepository=$repo"
          Write-Host "UpdateReleasesApiUrl=$releasesApi"

          # Framework-dependent (needs .NET 9 Desktop Runtime) — setup + standard zip
          dotnet publish Borderless.App/Borderless.App.csproj `
            @common `
            --self-contained false `
            -o publish

          # Self-contained — bundled zip only
          dotnet publish Borderless.App/Borderless.App.csproj `
            @common `
            --self-contained true `
            -o publish-bundled

      - name: Ensure VERSION + update.json
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $repo = "${{ github.repository }}"
          $repoUrl = "https://github.com/$repo"
          $releasesApi = "https://api.github.com/repos/$repo/releases/latest"
          $releasesPage = "https://github.com/$repo/releases"
          $updateJson = @{
            repository = $repo
            releasesApiUrl = $releasesApi
            releasesPageUrl = $releasesPage
            repositoryUrl = $repoUrl
            distribution = "GitHub"
          } | ConvertTo-Json -Compress

          foreach ($dir in @("publish", "publish-bundled")) {
            Set-Content -Path "$dir/VERSION" -Value $v -NoNewline -Encoding utf8
            Set-Content -Path "$dir/update.json" -Value $updateJson -Encoding utf8
          }
          Set-Content -Path VERSION -Value $v -NoNewline -Encoding utf8
          Copy-Item publish/update.json update.json -Force
          Get-Content publish/VERSION
          Get-Content publish/update.json

      - name: Package zips
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $zip = "Borderless-$v-win-x64.zip"
          $zipBundled = "Borderless-$v-win-x64-bundled.zip"
          foreach ($f in @($zip, $zipBundled)) {
            if (Test-Path $f) { Remove-Item $f -Force }
          }
          Compress-Archive -Path publish\* -DestinationPath $zip -CompressionLevel Optimal
          Compress-Archive -Path publish-bundled\* -DestinationPath $zipBundled -CompressionLevel Optimal
          Get-Item $zip, $zipBundled | Format-List Name, Length
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            Write-Host "Inno Setup already installed: $iscc"
            exit 0
          }
          choco install innosetup -y --no-progress
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe not found after install: $iscc"
          }

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $src = (Resolve-Path "publish").Path
          $setup = "Borderless-$v-win-x64-setup.exe"
          if (Test-Path $setup) { Remove-Item $setup -Force }

          & $iscc /Q `
            "/DMyAppVersion=$v" `
            "/DMyAppSourceDir=$src" `
            "installer\Borderless.iss"

          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path $setup)) { throw "Missing setup: $setup" }
          Get-Item $setup | Format-List Name, Length

      - name: Build MSIX package
        shell: pwsh
        env:
          MSIX_PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
          MSIX_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
          MSIX_PUBLISHER: ${{ secrets.MSIX_PUBLISHER }}
          MSIX_PACKAGE_IDENTITY_NAME: ${{ secrets.MSIX_PACKAGE_IDENTITY_NAME }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ secrets.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $msix = "Borderless-$v-win-x64.msix"
          $pfx = ""

          foreach ($required in @("MSIX_PUBLISHER", "MSIX_PACKAGE_IDENTITY_NAME", "MSIX_PUBLISHER_DISPLAY_NAME")) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($required))) {
              throw "Missing GitHub Actions secret: $required"
            }
          }

          if (-not [string]::IsNullOrWhiteSpace($env:MSIX_PFX_BASE64)) {
            $pfx = Join-Path $env:RUNNER_TEMP "borderless-msix.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:MSIX_PFX_BASE64))
          }

          $args = @{
            SourceDir            = "publish-bundled"
            Version              = $v
            OutFile              = $msix
            PackageIdentityName  = $env:MSIX_PACKAGE_IDENTITY_NAME
            Publisher            = $env:MSIX_PUBLISHER
            PublisherDisplayName = $env:MSIX_PUBLISHER_DISPLAY_NAME
          }
          if ($pfx) {
            $args.PfxPath = $pfx
            $args.PfxPassword = $env:MSIX_PFX_PASSWORD
          }

          & .\installer\msix\Build-Msix.ps1 @args
          if (-not (Test-Path $msix)) { throw "Missing MSIX: $msix" }

          if ($pfx -and (Test-Path $pfx)) {
            Remove-Item $pfx -Force
          }

      - name: Build release notes from commits
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $prev = (git describe --tags --abbrev=0 "$($tag)^" 2>$null | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { $prev = "" }

          if ([string]::IsNullOrWhiteSpace($prev)) {
            Write-Host "No previous tag — listing all commits reachable from $tag"
            $lines = @(git log --pretty=tformat:"- %s (%h)" $tag)
          }
          else {
            Write-Host "Commits: $prev..$tag"
            $lines = @(git log --pretty=tformat:"- %s (%h)" "$prev..$tag")
          }

          if ($lines.Count -eq 0 -or ($lines.Count -eq 1 -and [string]::IsNullOrWhiteSpace($lines[0]))) {
            $lines = @("- No commits listed for this range.")
          }

          # git log as string[] must be joined explicitly — "$array" uses spaces, not newlines.
          $commits = ($lines | ForEach-Object { $_.TrimEnd() }) -join "`n"
          $body = "## Changes`n`n$commits`n"
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) "release-notes.md"),
            $body,
            [System.Text.UTF8Encoding]::new($false))
          Get-Content release-notes.md -Raw

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $version = "${{ steps.version.outputs.version }}"
          $zip = "Borderless-$version-win-x64.zip"
          $zipBundled = "Borderless-$version-win-x64-bundled.zip"
          $setup = "Borderless-$version-win-x64-setup.exe"
          $msix = "Borderless-$version-win-x64.msix"

          gh release create $tag `
            --draft `
            --title "Borderless $version" `
            --notes-file release-notes.md `
            $zip `
            $zipBundled `
            $setup `
            $msix `
            VERSION `
            update.json
